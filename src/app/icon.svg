<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="peanutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="32" height="32" rx="7.5" fill="url(#peanutGrad)" />
  
  <!-- Sprout stem and leaves (Crisp White with drop shadow) -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Plant Stem -->
    <path d="M8 25 C8 17.5 12 12.5 16 10 V25" stroke-width="2.3" />
    <!-- Leaf 1 (Left) -->
    <path d="M16 16 C11.5 16 8.5 12.5 8.5 8.5 C12.5 8.5 16 11.5 16 16 Z" fill="#ffffff" stroke-width="0.8" />
    <!-- Leaf 2 (Right) -->
    <path d="M16 12 C20.5 12 23.5 8.5 23.5 4.5 C19.5 4.5 16 7.5 16 12 Z" fill="#ffffff" stroke-width="0.8" />
  </g>

  <!-- Water droplet on the side -->
  <path d="M22 17 C22 15 20.5 13 20.5 13 C20.5 13 19 15 19 17 C19 18.1 19.9 19 21 19 C22.1 19 22 18.1 22 17 Z" fill="#67e8f9" />
</svg>
